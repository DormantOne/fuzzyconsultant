const state = { query: '' };

const $ = (id) => document.getElementById(id);
const norm = (s) => (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const words = (s) => norm(s).split(/\s+/).filter(Boolean);

function acronym(text) {
  const stop = new Set(['and','the','of','in','for','to','with','from','a','an','on','at','by','is']);
  return words(text).filter(w => !stop.has(w) && w.length > 2).slice(0, 8).map(w => w[0]).join('');
}

function fuzzySubsequenceScore(needle, hay) {
  if (!needle || !hay) return 0;
  let j = 0, streak = 0, bestStreak = 0;
  for (let i = 0; i < hay.length && j < needle.length; i++) {
    if (hay[i] === needle[j]) { j++; streak++; bestStreak = Math.max(bestStreak, streak); }
    else streak = 0;
  }
  if (j !== needle.length) return 0;
  return Math.min(28, 8 + bestStreak * 3 + Math.round((needle.length / Math.max(hay.length, 1)) * 12));
}

function scoreLecture(lecture, query) {
  const q = norm(query);
  if (!q) return 0;

  const qWords = words(q);
  const title = norm(lecture.title);
  const presenter = norm(lecture.presenter);
  const keywordText = norm((lecture.keywords || []).join(' '));
  const raw = norm(lecture.rawTitle);
  const date = norm(lecture.dateLabel || lecture.date);
  const series = norm(lecture.seriesLabel || lecture.series);
  const archiveText = lecture.archive ? ' archive archived old historical' : '';
  const hay = [title, presenter, keywordText, raw, date, series, archiveText].join(' ');

  let score = lecture.archive ? 2 : 0;

  if (title.includes(q)) score += 120 + q.length * 2;
  else if (hay.includes(q)) score += 82 + q.length;

  const ac = acronym(lecture.title);
  if (q.length >= 2 && ac.includes(q.replace(/\s/g, ''))) score += 70;

  for (const w of qWords) {
    if (w.length < 2) continue;

    if (title.split(' ').some(t => t === w)) score += 42;
    else if (title.split(' ').some(t => t.startsWith(w))) score += 34;
    else if (title.includes(w)) score += 25;

    if (keywordText.split(' ').some(t => t === w || t.startsWith(w))) score += 28;
    else if (keywordText.includes(w)) score += 18;

    if (presenter.includes(w)) score += 22;
    if (date.includes(w)) score += 12;
    if (lecture.archive && (w === 'archive' || w === 'archived')) score += 45;
    score += fuzzySubsequenceScore(w, title) * 0.55;
  }

  return Math.round(score);
}

function byDateDesc(a, b) {
  return (b.date || '').localeCompare(a.date || '') || (a.sortOrder || 0) - (b.sortOrder || 0);
}

function filteredAndRanked() {
  const q = state.query;
  if (!q) {
    return [...lectures].sort(byDateDesc);
  }

  return lectures
    .map(l => ({ ...l, score: scoreLecture(l, q) }))
    .filter(l => l.score > 12)
    .sort((a,b) => b.score - a.score || byDateDesc(a, b));
}

function visibleLinks(lecture) {
  return (lecture.links || []).filter(link => {
    const label = (link.label || '').toLowerCase();
    return link.type !== 'discuss_ai' && !label.includes('discuss with ai') && !label.includes('discuss g.r.') && !label.includes('ask ai');
  });
}

function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function regexEscape(s) {
  return (s || '').replace(/[.*+?^${}()|[\]\]/g, '\$&');
}

function regexEscape(s) {
  return (s || '').replace(/[.*+?^${}()|[\]\]/g, '\$&');
}

function highlight(text) {
  let out = escapeHtml(text || '');
  for (const w of words(state.query).filter(x => x.length >= 2).slice(0, 5)) {
    const re = new RegExp('(' + regexEscape(w) + ')', 'ig');
    out = out.replace(re, '<mark>$1</mark>');
  }
  return out;
}

function renderCard(l) {
  const links = visibleLinks(l);
  const badgeClass = l.archive ? 'archive' : escapeHtml(l.series);
  const badgeText = l.archive ? `${escapeHtml(l.seriesLabel || 'CMI')} Archive` : escapeHtml(l.seriesLabel);
  return `
    <article class="result ${l.archive ? 'archive' : ''}">
      <div class="result-head">
        <span class="badge ${badgeClass}">${badgeText}</span>
        <span class="date">${escapeHtml(l.dateLabel || '')}</span>
      </div>
      <div class="title">${highlight(l.title)}</div>
      <div class="presenter">${highlight(l.presenter)}</div>
      ${links.length ? `<div class="links">${links.map(link => `<a data-type="${escapeHtml(link.type)}" href="${escapeHtml(link.url)}" target="_blank" rel="noopener">${escapeHtml(link.label)}</a>`).join('')}</div>` : ''}
    </article>
  `;
}

function render() {
  const ranked = filteredAndRanked();
  const totalTalks = lectures.filter(l => !l.archive).length;
  const totalArchives = lectures.filter(l => l.archive).length;
  $('countPill').textContent = `${totalTalks} talks${totalArchives ? ` + ${totalArchives} archives` : ''}`;
  $('statusText').textContent = state.query
    ? `${ranked.length} match${ranked.length === 1 ? '' : 'es'}`
    : `Showing all ${totalTalks} talks${totalArchives ? ` + ${totalArchives} archives` : ''}`;

  if (!ranked.length) {
    $('results').innerHTML = `<div class="empty">No match yet. Try fewer letters or a presenter name.</div>`;
  } else if (!state.query) {
    const talks = ranked.filter(l => !l.archive);
    const archives = ranked.filter(l => l.archive).sort((a,b) => (a.archiveOrder || 999) - (b.archiveOrder || 999));
    $('results').innerHTML = talks.map(renderCard).join('') +
      (archives.length ? `<h2 class="section-title">Archives</h2>${archives.map(renderCard).join('')}` : '');
  } else {
    $('results').innerHTML = ranked.map(renderCard).join('');
  }

  localStorage.setItem('handbookFuzzyQuery', state.query);
}

function wireControls() {
  $('query').addEventListener('input', (e) => {
    state.query = e.target.value;
    render();
  });
}

async function loadData() {
  try {
    const res = await fetch('lectures.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    lectures = data.lectures || [];
  } catch (err) {
    lectures = EMBEDDED_LECTURES;
    console.warn('Using embedded fallback because lectures.json did not load:', err);
  }

  state.query = localStorage.getItem('handbookFuzzyQuery') || '';
  $('query').value = state.query;
  render();
}

wireControls();
loadData();
